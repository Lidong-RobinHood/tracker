<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B0B0F" media="(prefers-color-scheme: dark)">
<meta name="description" content="Personal food and workout tracker">
<title>Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Tracker">
<link rel="stylesheet" href="app.css">
<script>
// If the app's code cannot be loaded (offline on first visit, or the host is briefly unavailable),
// show a message with a reload button instead of a blank page.
// The text is chosen like src/i18n/index.js does (stored choice 'tracker.language', else the device
// languages); it cannot use the catalogues, which are modules that may be what failed to load.
window.__bootFail = function () {
  var m = document.getElementById('main');
  if (!m || m.childElementCount) return;
  var T = {
    en: ['The app could not be loaded. Check your connection and try again.', 'Reload'],
    de: ['Die App konnte nicht geladen werden. Prüfe deine Verbindung und versuche es noch einmal.', 'Neu laden'],
    zh: ['无法加载应用。请检查网络连接后重试。', '重新加载']
  };
  var lang = null;
  try { lang = localStorage.getItem('tracker.language'); } catch (e) { /* storage blocked */ }
  if (!T[lang]) {
    var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en'];
    lang = 'en';
    for (var i = 0; i < prefs.length; i++) {
      var base = String(prefs[i] || '').toLowerCase().split(/[-_]/)[0];
      if (T[base]) { lang = base; break; }
    }
  }
  try { document.documentElement.lang = lang === 'zh' ? 'zh-Hans' : lang; } catch (e) { /* ignore */ }
  var p = document.createElement('p'); p.className = 'empty';
  p.textContent = T[lang][0];
  var b = document.createElement('button'); b.type = 'button'; b.className = 'btn btn-primary';
  b.textContent = T[lang][1]; b.onclick = function () { location.reload(); };
  var d = document.createElement('div'); d.className = 'view'; d.appendChild(p); d.appendChild(b);
  m.appendChild(d);
};
window.addEventListener('load', function () { setTimeout(window.__bootFail, 8000); });
</script>
<script type="module" src="src/app.js" onerror="window.__bootFail && (document.readyState === 'loading' ? document.addEventListener('DOMContentLoaded', window.__bootFail) : window.__bootFail())"></script>
</head>
<body>
<main id="main" class="app-main"></main>
<nav id="tabbar" class="tabbar" aria-label="Sections"></nav>
<noscript><p class="empty">This app needs JavaScript.<br><span lang="de">Diese App braucht JavaScript.</span><br><span lang="zh-Hans">此应用需要 JavaScript。</span></p></noscript>
</body>
</html>
